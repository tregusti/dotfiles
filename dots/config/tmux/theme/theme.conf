# Hand-rolled Selenized theme wiring (see .scratch/tmux-selenized-theme/PRD.md).
# layout.conf references #{@color_*} vars and is never re-sourced on a
# dark/light switch — only the palette file changes, tmux expands #{@var}
# live at render time.
source-file ~/.config/tmux/theme/layout.conf

# Ghostty emits a DEC 2031 report on macOS appearance change; these built-in
# tmux hooks fire in response and just re-source the matching palette file.
set-hook -g client-dark-theme 'source-file ~/.config/tmux/theme/selenized-dark.conf'
set-hook -g client-light-theme 'source-file ~/.config/tmux/theme/selenized-light.conf'

# Boot default: match the current macOS appearance, so a fresh tmux start
# (or a config reload) never mismatches the OS if it's already in dark mode
# before Ghostty has emitted a client-dark-theme report.
# Uses run-shell (not if-shell) because tpack's own config parser rejects
# source-file appearing as one of if-shell's branch commands; run-shell's
# argument is an opaque shell string to it, same as the set-hook lines
# above, so the source-file calls here go through `tmux source-file`
# instead of being literal tmux commands in the file.
run-shell "\
  if defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark; then \
    tmux source-file ~/.config/tmux/theme/selenized-dark.conf; \
  else \
    tmux source-file ~/.config/tmux/theme/selenized-light.conf; \
  fi"
