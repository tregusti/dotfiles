# Layout only — references #{@color_*} palette vars, never re-sourced on a
# dark/light switch. tmux expands #{@var} at render time, so re-sourcing
# just the palette file (selenized-dark.conf / selenized-light.conf) is
# enough for the next redraw to pick up new colors.
set -g status-style "bg=#{@color_bg_2},fg=#{@color_fg_0}"

set -g @theme_block_default "#[fg=#{@color_fg_0},bg=#{@color_bg_2}]"
set -g @theme_block_inverted "#[fg=#{@color_bg_2},bg=#{@color_fg_0}]"
set -g @theme_block_red "#[fg=#{@color_bg_2},bg=#{@color_red}]"
set -g @theme_sep "#[bg=#{@color_bg_2},fg=#{@color_fg_0}] | "

set -g @theme_session_name "#{E:@theme_block_red}#[bold] #S "
set -g @theme_git_repo_available "#(cd #{pane_current_path} && git rev-parse --is-inside-work-tree 2>/dev/null)"
set -g @theme_git_branch "#{?#{E:@theme_git_repo_available},#{E:@theme_block_inverted} #(gitmux -cfg ~/.config/tmux/theme/gitmux.conf #{pane_current_path}) #[default],#[default] }"

set -g @theme_zoomed "🔍 #{?window_zoomed_flag,IN ,OUT}"
set -g @theme_battery "#{battery_icon_status} #{battery_color_charge_bg}#[fg=#333333]#{battery_percentage}"
set -g @theme_time "#{E:@theme_block_red} %H:%M "

# Session name, in the accent color. Raised from tmux's default 10 (too
# short — truncates mid-string instead of just being narrow.
set -g status-left-length 100
set -g status-left "#{E:@theme_session_name}#{E:@theme_git_branch}"

set -g @theme_window_flags "#{?window_bell_flag, 🔔,}#{?window_activity_flag, ⚠️,}"
set -g window-status-current-format '#{E:@theme_block_inverted}#[bold]#I ● #{E:@theme_block_inverted}#W#{E:@theme_window_flags}#{E:@theme_block_default}'
set -g window-status-format '#[bg=#{@color_fg_0},fg=#{@color_bg_2}]#I ○ #W#{E:@theme_window_flags}#{E:@theme_block_default}'

set -g status-right "#{E:@theme_zoomed}#{E:@theme_sep}#{E:@theme_battery}#[default] #{E:@theme_time}"
