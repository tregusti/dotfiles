# Selenized dark palette. Sourced by the client-dark-theme hook in
# tmux.conf, and unconditionally at startup if dark is the boot default.
# Colors from:
# https://github.com/jan-warchol/selenized/blob/master/the-values.md
set -g @color_bg_0 '#103c48'
set -g @color_bg_1 '#184956'
# Matches nvim's selenized `base02` — used to make the tmux status bar read
# as its own surface, one shade off the editor bg, instead of blending into
# it. See .scratch/nvim-selenized-palette/issues/01-switch-nvim-to-selenized.md.
set -g @color_bg_2 '#184956'
set -g @color_dim_0 '#72898f'
set -g @color_fg_0 '#adbcbc'
set -g @color_fg_1 '#cad8d9'

set -g @color_red '#fa5750'
set -g @color_green '#75b938'
set -g @color_yellow '#dbb32d'
set -g @color_blue '#4695f7'
set -g @color_magenta '#f275be'
set -g @color_cyan '#41c7b9'
set -g @color_orange '#ed8649'
set -g @color_violet '#af88eb'

set -g @color_br_red '#ff665c'
set -g @color_br_green '#84c747'
set -g @color_br_yellow '#ebc13d'
set -g @color_br_blue '#58a3ff'
set -g @color_br_magenta '#ff84cd'
set -g @color_br_cyan '#53d6c7'
set -g @color_br_orange '#fd9456'
set -g @color_br_violet '#bd96fa'
