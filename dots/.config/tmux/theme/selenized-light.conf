# Selenized light palette. Sourced by the client-light-theme hook in
# tmux.conf, and unconditionally at startup as the boot default.
# Role order matches upstream jan-warchol/selenized/the-values.md.
set -g @color_bg_0 '#fbf3db'
set -g @color_bg_1 '#ece3cc'
set -g @color_dim_0 '#909995'
set -g @color_fg_0 '#53676d'
set -g @color_fg_1 '#3a4d53'

set -g @color_red '#d2212d'
set -g @color_green '#489100'
set -g @color_yellow '#ad8900'
set -g @color_blue '#0072d4'
set -g @color_magenta '#ca4898'
set -g @color_cyan '#009c8f'
set -g @color_orange '#c25d1e'
set -g @color_violet '#8762c6'

set -g @color_br_red '#ff4b49'
set -g @color_br_green '#78be2e'
set -g @color_br_yellow '#e4b424'
set -g @color_br_blue '#4a91ff'
set -g @color_br_magenta '#fb69c4'
set -g @color_br_cyan '#50cfba'
set -g @color_br_orange '#f67e41'
set -g @color_br_violet '#ab80fc'
