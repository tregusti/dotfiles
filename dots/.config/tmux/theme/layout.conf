# Layout only — references #{@color_*} palette vars, never re-sourced on a
# dark/light switch. tmux expands #{@var} at render time, so re-sourcing
# just the palette file (selenized-dark.conf / selenized-light.conf) is
# enough for the next redraw to pick up new colors.
set -g status-style "bg=#{@color_bg_0},fg=#{@color_fg_0}"
