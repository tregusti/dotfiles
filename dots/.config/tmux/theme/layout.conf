# Layout only — references #{@color_*} palette vars, never re-sourced on a
# dark/light switch. tmux expands #{@var} at render time, so re-sourcing
# just the palette file (selenized-dark.conf / selenized-light.conf) is
# enough for the next redraw to pick up new colors.
set -g status-style "bg=#{@color_bg_0},fg=#{@color_fg_0}"

set -g @theme_sep "#[bg=#{@color_bg_0},fg=#{@color_fg_0}] | "

set -g @theme_session_name "#[bg=#{@color_blue},fg=#{@color_bg_0},bold] #S "

set -g @theme_zoomed "🔍 #{?window_zoomed_flag,IN ,OUT}"
set -g @theme_battery "#{battery_color_charge_bg}#[fg=#333333]#{battery_percentage}"
set -g @theme_time "#[bg=#{@color_blue},fg=#{@color_bg_0}] %H:%M "

# Session name, in the accent color. Raised from tmux's default 10 (too
# short — truncates mid-string instead of just being narrow) to 20.
set -g status-left-length 40
set -g status-left "#{E:@theme_session_name}"

set -g window-status-current-format '#[bg=#{@color_bg_0},fg=#{@color_fg_0},bold] #I#[fg=#{@color_green}] ● #[fg=#{@color_fg_0}]#W'
set -g window-status-format '#[bg=#{@color_bg_0},fg=#{@color_fg_0}] #I ○ #W'

set -g status-right "#{E:@theme_zoomed}#{E:@theme_sep}#{E:@theme_battery}#[default] #{E:@theme_time}"
