# tmux config. Every choice below was made in a grilling session — see
# teach/tmux/NOTES.md ("Config decision log") for the reasoning behind each
# line, and teach/tmux/lessons/ for the guided lessons this builds on.

# Prefix: Ctrl-a instead of the default Ctrl-b (shorter reach). C-a doubled
# passes a literal Ctrl-a through to the shell/program (e.g. readline's
# "move to start of line"), since the prefix otherwise swallows it.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Copy-mode uses vi-style keys (hjkl navigate, v select, y yank) to match
# Vim/Neovim muscle memory instead of the emacs-style default.
set -g mode-keys vi

# Kill the default ~500ms wait after Esc. Left at the default, this reads as
# input lag leaving insert mode in any Neovim running inside a tmux pane.
set -sg escape-time 10

# Start window/pane numbering at 1, not 0 — keeps window-switch-by-number
# (prefix + 1, 2, ...) starting under the same finger as the prefix itself.
set -g base-index 1
set -g pane-base-index 1

# Click to select/focus a pane, drag a border to resize, scroll to enter
# copy-mode. Purely additive — doesn't change any keybinding.
set -g mouse on

# Pass through modified-key sequences (Ctrl held with punctuation that has
# no classic ASCII control code, e.g. Ctrl-, or Ctrl-/) instead of tmux
# collapsing them to the same thing as the unmodified key. Off by default.
# Needed for Neovim's own <C-,> / <C-/> keymaps (agent/terminal toggles,
# config/keymaps.lua) to keep working now that Neovim runs inside a tmux
# pane instead of talking to Ghostty directly.
set -s extended-keys on

# Vi-style pane navigation, alongside (not replacing) the arrow-key defaults.
# tmux-only — crossing seamlessly into Neovim's own splits with the same keys
# is a separate thing (vim-tmux-navigator), deliberately deferred, see
# MISSION.md.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Rename window and pin it: overrides the default `,` (rename-window) to
# also turn off automatic-rename, so the name just typed doesn't get
# silently overwritten the next time the pane's running command changes
# (and survives tmux-resurrect restores, which faithfully reproduce
# whatever automatic-rename was set to at save time — see teach/tmux/
# lesson 7).
bind , command-prompt -I "#W" -p "Rename window:" \
  "rename-window -- '%%' ; set-window-option automatic-rename off"

# Reload tmux config
bind r {
  source-file ~/.config/tmux/tmux.conf
  display-message "tmux.conf reloaded"
}

bind-key S display-popup -E -w 60% -h 40% \
  "tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t"

bind-key s display-popup -E -w 60% -h 40% "~/.config/tmux/tms.mjs"

# Was `on` (OSC 52 passthrough to the macOS clipboard) — reverted 2026-08-18.
# Confirmed root cause of a real bug: mouse-drag-selecting text anywhere
# inside the Claude Code CLI (running nested: tmux pane -> Neovim terminal
# buffer -> Claude CLI) injected garbled/base64-looking data into its input
# field. Isolation tests confirmed it (both "hold Shift to bypass tmux mouse
# capture" and "set-clipboard off" independently fixed it) — see
# teach/tmux/NOTES.md's "Corrections" section. Neovim's own clipboard
# (clipboard = unnamedplus, via pbcopy/pbpaste) is unaffected and still
# works normally; only tmux's own copy-mode-to-system-clipboard convenience
# is lost.
set -g set-clipboard off

# --- status bar: hand-written, minimal. No theme plugin (yet). ---
set -g status-position bottom
set -g status-left '#[bold]#S '
set -g status-right '%H:%M'
set -g window-status-current-format '#[bold][#I:#W]'
set -g window-status-format '#I:#W'


# --- plugins, via tpm ---
# One-time bootstrap (not run by this file):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install/update plugins from inside a running session: prefix + I

# --- tmp the plugin manager itself
set -g @plugin 'tmux-plugins/tpm'

# --- vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
# The plugin's tmux bindings are -n (no prefix), which means Ctrl-l
# (readline "clear screen") and Ctrl-\ (SIGQUIT) stop reaching the
# shell directly. Add these two lines to get them back via the prefix
# instead:
bind C-l send-keys 'C-l'
bind C-\\ send-keys 'C-\'

# --- tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
# extend the allow-list. Prefix an entry with ~ (e.g. '~rails server') to match
# it as a substring anywhere in the full command line, not an exact match.
set -g @resurrect-processes '"~pnpm run dev" "claude --continue" ~serve'
# also save each pane's visible scrollback text, not just which programs were
# running.
set -g @resurrect-capture-pane-contents 'on'

# --- tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
# automatically restore all sessions on startup
set -g @continuum-restore 'on'
# instead of default 15
set -g @continuum-save-interval '10'

# Must stay the last line in the file (tpm's own requirement).
run '~/.tmux/plugins/tpm/tpm'
